<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPU Power Management Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: #161b22; border-bottom: 1px solid #30363d; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .card-header { background: #1c2128; border-bottom: 1px solid #30363d; font-weight: 600; }
    .table { color: #e6edf3; }
    .table th { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; border-color: #30363d; }
    .table td { border-color: #21262d; vertical-align: middle; font-size: 0.9rem; }
    .badge-storm { background: #da3633; }
    .badge-ok    { background: #238636; }
    .badge-warn  { background: #9e6a03; }
    .stat-card { text-align: center; padding: 1.25rem; }
    .stat-num  { font-size: 2.2rem; font-weight: 700; line-height: 1; }
    .stat-label{ font-size: 0.8rem; color: #8b949e; margin-top: .3rem; }
    .pct-bar   { height: 6px; border-radius: 3px; background: #21262d; margin-top: 4px; }
    .pct-fill  { height: 100%; border-radius: 3px; background: #238636; transition: width .4s; }
    .pct-fill.warn  { background: #9e6a03; }
    .pct-fill.storm { background: #da3633; }
    .refresh-btn { font-size: 0.8rem; }
    #last-updated { font-size: 0.75rem; color: #8b949e; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3 mb-4">
  <span class="navbar-brand fw-bold">GPU Power Management</span>
  <div class="d-flex align-items-center gap-3">
    <span id="last-updated"></span>
    <button class="btn btn-outline-secondary btn-sm refresh-btn" onclick="loadAll()">Refresh</button>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Summary stats -->
  <div class="row g-3 mb-4" id="stats-row">
    <div class="col-6 col-md-3">
      <div class="card stat-card">
        <div class="stat-num text-info" id="stat-nodes">—</div>
        <div class="stat-label">GPU Nodes Tracked</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card">
        <div class="stat-num text-warning" id="stat-reboots-24h">—</div>
        <div class="stat-label">Reboots (last 24 h)</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card">
        <div class="stat-num text-danger" id="stat-storm-nodes">—</div>
        <div class="stat-label">Nodes in Storm State</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card">
        <div class="stat-num text-success" id="stat-power-events">—</div>
        <div class="stat-label">Power Limit Events</div>
      </div>
    </div>
  </div>

  <!-- Node table -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Node Status</span>
      <input class="form-control form-control-sm w-auto" id="node-filter" placeholder="Filter nodes…" oninput="filterTable()">
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0" id="node-table">
          <thead><tr>
            <th>Node</th>
            <th>GPU Model</th>
            <th>Reboots (24h)</th>
            <th>Total Reboots</th>
            <th>Last Reboot</th>
            <th>Power Limit</th>
            <th>State</th>
          </tr></thead>
          <tbody id="node-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Recent events -->
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Recent Reboots</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr>
                <th>Time</th><th>Node</th><th>GPU Model</th><th>Count 24h</th><th>Power%</th>
              </tr></thead>
              <tbody id="reboot-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Recent Power Limit Changes</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr>
                <th>Time</th><th>Node</th><th>GPU</th><th>Old→New (W)</th><th>%</th><th>Status</th>
              </tr></thead>
              <tbody id="power-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script>
const STORM_THRESHOLD = 3;

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const age = Date.now() - d;
  if (age < 60000) return 'just now';
  if (age < 3600000) return Math.floor(age/60000) + 'm ago';
  if (age < 86400000) return Math.floor(age/3600000) + 'h ago';
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
}

function stateBadge(reboots24h) {
  if (reboots24h >= STORM_THRESHOLD) return '<span class="badge badge-storm">STORM</span>';
  if (reboots24h > 0) return '<span class="badge badge-warn">UNSTABLE</span>';
  return '<span class="badge badge-ok">OK</span>';
}

function pctBar(pct) {
  const cls = pct <= 80 ? 'storm' : pct <= 90 ? 'warn' : '';
  return `<div>${pct ?? 100}%<div class="pct-bar"><div class="pct-fill ${cls}" style="width:${pct ?? 100}%"></div></div></div>`;
}

async function loadAll() {
  try {
    const [nodesRes, eventsRes] = await Promise.all([
      fetch('/api/nodes'),
      fetch('/api/events?limit=50'),
    ]);
    const nodes  = await nodesRes.json();
    const events = await eventsRes.json();

    renderNodes(nodes);
    renderReboots(events.reboot_events || []);
    renderPower(events.power_limit_events || []);
    renderStats(nodes, events);

    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error('Failed to load data:', e);
  }
}

function renderStats(nodes, events) {
  const reboots24h  = nodes.reduce((s,n) => s + (n.reboots_24h||0), 0);
  const stormNodes  = nodes.filter(n => n.reboots_24h >= STORM_THRESHOLD).length;
  const powerEvents = (events.power_limit_events||[]).length;
  document.getElementById('stat-nodes').textContent      = nodes.length;
  document.getElementById('stat-reboots-24h').textContent = reboots24h;
  document.getElementById('stat-storm-nodes').textContent = stormNodes;
  document.getElementById('stat-power-events').textContent = powerEvents;
}

function renderNodes(nodes) {
  const tbody = document.getElementById('node-tbody');
  tbody.innerHTML = nodes.map(n => `
    <tr>
      <td><code>${n.node_name}</code></td>
      <td>${n.gpu_model || '—'}</td>
      <td>${n.reboots_24h || 0}</td>
      <td>${n.total_reboots || 0}</td>
      <td>${fmtTime(n.last_reboot)}</td>
      <td>${pctBar(n.current_pct)}</td>
      <td>${stateBadge(n.reboots_24h || 0)}</td>
    </tr>`).join('');
}

function renderReboots(events) {
  const tbody = document.getElementById('reboot-tbody');
  tbody.innerHTML = events.map(e => `
    <tr>
      <td>${fmtTime(e.created_at)}</td>
      <td><code>${e.node_name}</code></td>
      <td>${e.gpu_model || '—'}</td>
      <td>${e.reboot_count_24h || 0}</td>
      <td>${e.power_pct_applied != null ? e.power_pct_applied+'%' : '—'}</td>
    </tr>`).join('');
}

function renderPower(events) {
  const tbody = document.getElementById('power-tbody');
  tbody.innerHTML = events.map(e => `
    <tr>
      <td>${fmtTime(e.applied_at)}</td>
      <td><code>${e.node_name}</code></td>
      <td>GPU ${e.gpu_index ?? '?'}</td>
      <td>${e.old_power_limit_watts ?? '?'}→${e.new_power_limit_watts ?? '?'}</td>
      <td>${e.target_pct != null ? e.target_pct+'%' : '—'}</td>
      <td><span class="badge ${e.status==='applied'?'badge-ok':'badge-storm'}">${e.status}</span></td>
    </tr>`).join('');
}

function filterTable() {
  const q = document.getElementById('node-filter').value.toLowerCase();
  document.querySelectorAll('#node-tbody tr').forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
