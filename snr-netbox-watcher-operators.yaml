apiVersion: v1
kind: ServiceAccount
metadata:
  name: snr-netbox-watcher
  namespace: operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snr-netbox-watcher-nodes-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snr-netbox-watcher-nodes-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snr-netbox-watcher-nodes-read
subjects:
  - kind: ServiceAccount
    name: snr-netbox-watcher
    namespace: operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snr-netbox-watcher-namespaces-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snr-netbox-watcher-namespaces-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snr-netbox-watcher-namespaces-read
subjects:
  - kind: ServiceAccount
    name: snr-netbox-watcher
    namespace: operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snr-netbox-watcher-snr
  namespace: operators
rules:
  - apiGroups: ["self-node-remediation.medik8s.io"]
    resources:
      - selfnoderemediations
    verbs: ["get", "list", "watch", "patch", "update", "delete"]

  - apiGroups: ["self-node-remediation.medik8s.io"]
    resources:
      - selfnoderemediations/status
    verbs: ["get", "patch", "update"]

  - apiGroups: ["self-node-remediation.medik8s.io"]
    resources:
      - selfnoderemediations/finalizers
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snr-netbox-watcher-snr
  namespace: operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snr-netbox-watcher-snr
subjects:
  - kind: ServiceAccount
    name: snr-netbox-watcher
    namespace: operators
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snr-netbox-config
  namespace: operators
data:
  NB_URL: "https://netbox.nrp-nautilus.io"
  NB_OBJECT_TYPE: "dcim.device"
  PROM_URL: "http://prometheus-k8s.monitoring.svc:9090"
  GPUFAILED_RECENT_WINDOW: "1h"
  METRICS_PORT: "8000"
  SNR_NAMESPACE: "operators"
  SNR_SWEEP_PERIOD_SEC: "60"
  TAINT_SKIP_LIST: "nautilus.io/issue,nautilus.io/system,nautilus.io/ceph,nautilus.io/ceph-external"
  ENABLE_ACTIVE_REMEDIATION: "true"
  STUCK_GRACE_MINUTES: "30"
  STUCK_DELETE_AFTER_MINUTES: "45"
  LOOKBACK_HOURS: "24"
  NETBOX_TIMEOUT_SEC: "20"
  SKIP_LOG_EVERY_SEC: "1800"
  BLOCKED_LOG_EVERY_SEC: "21600"
  JOURNAL_MAX_MSG_CHARS: "160"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snr-netbox-watcher
  namespace: operators
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snr-netbox-watcher
  template:
    metadata:
      labels:
        app: snr-netbox-watcher
    spec:
      serviceAccountName: snr-netbox-watcher
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          image: samunldocker/snrtest:latest
          imagePullPolicy: Always
          command: ["python", "-m", "kopf", "run"]
          args:
            - --standalone
            - --namespace=operators
            - /app/main.py
          envFrom:
            - configMapRef:
                name: snr-netbox-config
            - secretRef:
                name: netbox-token
          ports:
            - name: metrics
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: snr-netbox-watcher
  namespace: operators
  labels:
    app: snr-netbox-watcher
spec:
  selector:
    app: snr-netbox-watcher
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snr-netbox-watcher
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: snr-netbox-watcher
  namespaceSelector:
    matchNames:
      - operators
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snr-netbox-watcher-kopf-peering
  namespace: operators
rules:
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings", "kopfpeerings"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snr-netbox-watcher-kopf-peering
  namespace: operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snr-netbox-watcher-kopf-peering
subjects:
  - kind: ServiceAccount
    name: snr-netbox-watcher
    namespace: operators